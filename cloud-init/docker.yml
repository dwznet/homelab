#cloud-config
ssh_authorized_keys: [ WSTAW_SWOJ_KLUCZ_SSH ]

ssh_pwauth: false

package_update: true
package_upgrade: true

packages:
  - docker.io
  - docker-compose

runcmd:
  - systemctl enable docker
  - systemctl start docker
  - usermod -aG docker root

final_message: "Cloud-init provisioning finished (docker)"
